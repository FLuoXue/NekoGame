name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Configure native dependencies
        shell: bash
        run: |
          echo "npm_config_msvs_version=2022" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Prepare release metadata
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must contain a valid semver version: $TAG_NAME" >&2
            exit 1
          fi

          NOTES=$(git tag -l --format='%(contents)' "$TAG_NAME")
          if [ -z "$NOTES" ]; then
            printf '%s\n' "$TAG_NAME" > release-notes.md
          else
            printf '%s\n' "$NOTES" > release-notes.md
          fi

          printf 'Release tag: %s\n' "$TAG_NAME"
          printf 'Release notes:\n'
          cat release-notes.md

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build Windows installer
        shell: bash
        run: npx electron-builder --win --publish never -c.extraMetadata.version="$VERSION"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=()
          for file in dist/*; do
            [ -f "$file" ] || continue
            case "${file##*/}" in
              *debug*.yml|*debug*.yaml)
                continue
                ;;
            esac
            assets+=("$file")
          done

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release files found in dist/" >&2
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file release-notes.md
          fi

          gh release delete-asset "$TAG_NAME" builder-debug.yml --yes >/dev/null 2>&1 || true
          gh release upload "$TAG_NAME" "${assets[@]}" --clobber
